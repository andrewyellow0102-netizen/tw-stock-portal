<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個股報價 — TW Stock Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #0f1117;
      color: #e0e0e0;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid #2a2d3a;
    }

    header a {
      color: #f0c040;
      text-decoration: none;
      font-size: 1.25rem;
    }

    header h1 {
      font-size: 1rem;
      color: #888;
    }

    .main { padding: 1.5rem; max-width: 800px; margin: 0 auto; }

    .back-link {
      display: inline-block;
      color: #f0c040;
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    /* ── Quote Card ── */
    .quote-card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .quote-header {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .quote-name { font-size: 1.5rem; font-weight: 700; color: #fff; }
    .quote-code { font-size: 0.9rem; color: #888; }
    .quote-board {
      font-size: 0.75rem;
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      background: #2a2d3a;
      color: #aaa;
    }

    .quote-price-row {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .quote-price { font-size: 2.5rem; font-weight: 700; color: #fff; }
    .quote-change { font-size: 1.1rem; font-weight: 600; }
    .up   { color: #ef4444; }
    .down { color: #22c55e; }

    .quote-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.75rem 1.5rem;
      margin-top: 1rem;
    }

    .quote-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .quote-label { font-size: 0.75rem; color: #666; }
    .quote-value { font-size: 1rem; color: #e0e0e0; }

    /* ── Chart placeholder ── */
    .chart-card {
      background: #1a1d27;
      border: 1px solid #2a2d3a;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .chart-title { font-size: 1rem; font-weight: 600; }

    .range-buttons { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    .range-btn {
      padding: 0.3rem 0.7rem;
      border-radius: 6px;
      border: 1px solid #2a2d3a;
      background: transparent;
      color: #888;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .range-btn.active {
      background: #f0c040;
      color: #0f1117;
      border-color: #f0c040;
    }

    #chartCanvas { width: 100%; max-height: 320px; }

    /* ── Indicator toggles ── */
    .indicator-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .ind-btn {
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      border: 1px solid;
      background: transparent;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .ind-btn.ma5  { border-color: #3b82f6; color: #3b82f6; }
    .ind-btn.ma20 { border-color: #ef4444; color: #ef4444; }
    .ind-btn.ma60 { border-color: #a855f7; color: #a855f7; }
    .ind-btn.active.ma5  { background: #3b82f6; color: #fff; }
    .ind-btn.active.ma20 { background: #ef4444; color: #fff; }
    .ind-btn.active.ma60 { background: #a855f7; color: #fff; }

    /* ── Loading / Error states ── */
    .loading { text-align: center; padding: 2rem; color: #666; }
    .error-msg {
      background: #2a1515;
      border: 1px solid #5a2020;
      border-radius: 8px;
      padding: 1rem 1.25rem;
      color: #f87171;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 1rem;
      color: #444;
      font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <a href="/">&#8592;</a>
    <h1 id="pageTitle">個股報價</h1>
  </header>

  <div class="main">
    <a href="/" class="back-link">&#8592; 回首頁</a>

    <!-- Quote section -->
    <div class="quote-card" id="quoteCard">
      <div class="loading" id="quoteLoading">載入報價中...</div>
    </div>

    <!-- Chart section -->
    <div class="chart-card" id="chartCard" style="display:none">
      <div class="chart-header">
        <span class="chart-title">走勢圖</span>
        <div class="range-buttons">
          <button class="range-btn" data-range="5d">5日</button>
          <button class="range-btn active" data-range="1mo">1月</button>
          <button class="range-btn" data-range="3mo">3月</button>
          <button class="range-btn" data-range="6mo">6月</button>
          <button class="range-btn" data-range="1y">1年</button>
        </div>
      </div>

      <div class="indicator-row">
        <button class="ind-btn ma5 " id="btnMA5"  onclick="toggleMA(5)">MA5</button>
        <button class="ind-btn ma20 active" id="btnMA20" onclick="toggleMA(20)">MA20</button>
        <button class="ind-btn ma60" id="btnMA60" onclick="toggleMA(60)">MA60</button>
      </div>

      <canvas id="chartCanvas"></canvas>
    </div>
  </div>

  <footer>本系統僅供參考，不構成投資建議</footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    // ── State ──
    let chartData = null;
    let activeRange = "1mo";
    let visibleMA = new Set([20]);
    let priceChart = null;
    const SYMBOL = window.location.pathname.split("/stock/")[1];

    // ── Init ──
    (async () => {
      document.getElementById("pageTitle").textContent = SYMBOL;
      await loadQuote();
      await loadChart(activeRange);
    })();

    // ── Quote ──
    async function loadQuote() {
      const card = document.getElementById("quoteCard");
      try {
        const res = await fetch(`/api/quote/${SYMBOL}`);
        if (!res.ok) {
          const err = await res.json();
          card.innerHTML = `<div class="error-msg">${err.detail || "查無資料"}</div>`;
          return;
        }
        const q = await res.json();
        renderQuote(card, q);
      } catch (e) {
        card.innerHTML = `<div class="error-msg">載入失敗：${e.message}</div>`;
      }
    }

    function renderQuote(el, q) {
      const up = q.change >= 0;
      const sign = up ? "+" : "";
      const cls = up ? "up" : "down";
      const pe = q.pe_ratio !== null ? q.pe_ratio.toFixed(1) + "x" : "—";
      const pb = q.pb_ratio !== null ? q.pb_ratio.toFixed(2) : "—";

      el.innerHTML = `
        <div class="quote-header">
          <span class="quote-name">${q.name}</span>
          <span class="quote-code">${q.symbol.replace(".TW","").replace(".TWO","")}</span>
          <span class="quote-board">${q.board === "TWSE" ? "上市" : "上櫃"}</span>
        </div>
        <div class="quote-price-row">
          <span class="quote-price">$${q.price.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
          <span class="quote-change ${cls}">${sign}${q.change}（${sign}${q.change_pct}%）</span>
        </div>
        <div class="quote-grid">
          <div class="quote-item">
            <span class="quote-label">開盤</span>
            <span class="quote-value">$${q.open.toLocaleString()}</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">最高</span>
            <span class="quote-value">$${q.high.toLocaleString()}</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">最低</span>
            <span class="quote-value">$${q.low.toLocaleString()}</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">昨收</span>
            <span class="quote-value">$${q.prev_close.toLocaleString()}</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">成交量</span>
            <span class="quote-value">${(q.volume / 1000).toFixed(0)} 張</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">本益比</span>
            <span class="quote-value">${pe}</span>
          </div>
          <div class="quote-item">
            <span class="quote-label">股價淨值比</span>
            <span class="quote-value">${pb}</span>
          </div>
        </div>
      `;
    }

    // ── Chart ──
    async function loadChart(range) {
      activeRange = range;
      document.querySelectorAll(".range-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.range === range)
      );
      document.getElementById("chartCard").style.display = "block";

      try {
        const res = await fetch(`/api/chart/${SYMBOL}?range_=${range}`);
        if (!res.ok) { return; }
        chartData = await res.json();
        renderChart();
      } catch (e) {
        console.error("Chart load failed", e);
      }
    }

    function renderChart() {
      const { candles, ma5, ma20, ma60 } = chartData;
      const closes = candles.map(c => c.close);
      const labels = candles.map(c => new Date(c.date * 1000).toLocaleDateString("zh-TW", {month:"numeric",day:"numeric"}));

      const ctx = document.getElementById("chartCanvas").getContext("2d");

      if (priceChart) priceChart.destroy();

      const datasets = [
        {
          label: "收盤價",
          data: closes,
          borderColor: "#f0c040",
          backgroundColor: "rgba(240,192,64,0.1)",
          borderWidth: 1.5,
          pointRadius: 0,
          tension: 0.2,
          fill: true,
          yAxisID: "y",
        },
      ];

      if (visibleMA.has(5))  datasets.push(lineDS("MA5",  ma5,  "#3b82f6"));
      if (visibleMA.has(20)) datasets.push(lineDS("MA20", ma20, "#ef4444"));
      if (visibleMA.has(60)) datasets.push(lineDS("MA60", ma60, "#a855f7"));

      priceChart = new Chart(ctx, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          interaction: { intersect: false, mode: "index" },
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: "#1f2937" }, ticks: { color: "#6b7280", maxTicksLimit: 8 } },
            y: { position: "right", grid: { color: "#1f2937" }, ticks: { color: "#6b7280" } },
          },
        },
      });
    }

    function lineDS(label, values, color) {
      return { label, data: values, borderColor: color, borderWidth: 1, pointRadius: 0, tension: 0.2, fill: false };
    }

    function toggleMA(n) {
      if (visibleMA.has(n)) visibleMA.delete(n);
      else visibleMA.add(n);
      document.getElementById(`btnMA${n}`).classList.toggle("active", visibleMA.has(n));
      if (chartData) renderChart();
    }

    // Range buttons
    document.querySelectorAll(".range-btn").forEach(btn => {
      btn.addEventListener("click", () => loadChart(btn.dataset.range));
    });
  </script>
</body>
</html>
